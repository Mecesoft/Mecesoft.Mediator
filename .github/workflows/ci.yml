name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Mecesoft.Mediator.sln

      - name: Build
        run: >-
          dotnet build Mecesoft.Mediator.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Test .NET 8
        run: dotnet test tests/Mecesoft.Mediator.Tests/Mecesoft.Mediator.Tests.csproj --configuration Release --framework net8.0 --no-build --no-restore

      - name: Test .NET 10
        run: dotnet test tests/Mecesoft.Mediator.Tests/Mecesoft.Mediator.Tests.csproj --configuration Release --framework net10.0 --no-build --no-restore

      - name: Pack (validation only)
        run: >-
          dotnet pack Mecesoft.Mediator/Mecesoft.Mediator.csproj
          --configuration Release
          --no-build
          -p:ContinuousIntegrationBuild=true
          --output artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: |
            artifacts/Mecesoft.Mediator.*.nupkg
            artifacts/Mecesoft.Mediator.*.snupkg
          if-no-files-found: error
          retention-days: 7
